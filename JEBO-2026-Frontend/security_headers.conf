# Headers de seguridad, en un archivo aparte.
#
# Motivo: en nginx, un `location` que declara al menos un `add_header` NO hereda
# los del `server` — los reemplaza. Como `/assets/` y `/index.html` necesitan su
# propio `Cache-Control`, sus headers de seguridad hay que volver a declararlos.
#
# Con este include, la lista vive en un solo lugar. Agregar un header acá lo
# aplica a los tres bloques (server, /assets/, /index.html) y no se puede
# olvidar en uno.
#
# `always` en todos: sin eso el header solo se agrega en respuestas 2xx/3xx, y un
# 502 o 404 saldría desprotegido.
#
# NOTA: `Cache-Control` NO va acá a propósito. Es el único header que cambia
# según el bloque (no-store para la API y el index, public+immutable para los
# assets con hash en el nombre), y mezclarlo en esta lista haría que el último
# `add_header` en ganar sobre el resto.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
