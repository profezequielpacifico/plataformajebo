<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEBO 2026 - Sistema Administrativo</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,">
    <link rel="preload" as="image" type="image/svg+xml" href="/login-assets/bg-tl.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="/login-assets/bg-tr.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="/login-assets/bg-bl.svg">
    <link rel="preload" as="image" type="image/svg+xml" href="/login-assets/bg-br.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        body { overflow-wrap: break-word; }
        select, input, textarea { max-width: 100%; }
        select { text-overflow: ellipsis; }
        img { max-width: 100%; }
        #root {
            height: 100vh;
            width: 100vw;
        
            --status-programado: #4caf50;
            --status-en-juego: #2196f3;
            --status-cancelado: #f44336;
            --status-finalizado: #ff9800;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            html {
                font-size: 14px;
                line-height: 1.4;
            }
            body {
                font-size: 14px;
                line-height: 1.4;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/app.js"></script>
</body>
</html>
