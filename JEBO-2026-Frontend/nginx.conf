server {
    listen 80;
    server_name _;

    # La versión de nginx se oculta (X-14). `server_tokens off` solo saca la
    # versión de la cabecera `Server`; no cambia el error page por defecto, que
    # sigue mostrando la versión y se cambia con `msie_padding` + error_page.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------
    # X-12: el upstream se resuelve en cada request, no una vez al arrancar.
    #
    # Con `proxy_pass http://api:3000`, nginx resuelve "api" al arrancar y guarda
    # la IP para siempre. Medido: tras recrear el contenedor `jebo-api` (que
    # cambia de IP), `/api/health` daba 502 hasta que también se recreara
    # `jebo-web`. Con `resolver` + variable, cada request resuelve de nuevo y
    # sigue al contenedor aunque cambie.
    #
    # `valid=10s` es lo que evita el problema opuesto: sin TTL, cada request
    # paga una consulta DNS.
    # ---------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------------------------------------------------------
    # X-09: headers de seguridad.
    #
    # helmet los pone en la respuesta de la API, pero el documento HTML lo
    # sirve nginx y salía sin ninguno: medido 0 de CSP/HSTS/XFO/nosniff en
    # `GET /`, o sea clickjacking sobre la app.
    #
    # `frame-ancestors 'none'` reemplaza a X-Frame-Options: es lo que exige la
    # CSP moderna, y XFO queda como fallback para navegadores viejos. Esta
    # aplicación es una SPA sin iframes de terceros, así que `'none'` no rompe
    # nada.
    #
    # HSTS solo tiene sentido sobre TLS y este bloque es HTTP plano. Se aplica
    # igual para que, si delante se pone un terminador TLS, la política llegue;
    # sobre HTTP el navegador la ignora, así que no rompe nada.
    # ---------------------------------------------------------------
    include /etc/nginx/security_headers.conf;

    # ---------------------------------------------------------------
    # X-10: no cachear respuestas autenticadas ni el login.
    #
    # Sin esto, un token puede quedar en la caché del navegador o de un proxy
    # intermedio y seguir siendo válido al volver atrás.
    # ---------------------------------------------------------------
    add_header Cache-Control "no-store" always;

    # Tope de cuerpo. Sin esta linea el default de nginx es 1 MB, no el
    # limite de la API: un reglamento de 1,5 MB devolvia el 413 en HTML de
    # nginx sin pasar por multer, mientras `config/upload.js` decia 10 MB.
    # El 9m es un poco mas que los 8 MB que acepta la API, porque el body
    # multipart llega con el envelope por encima del archivo. Asi un archivo
    # de 8 MB pasa, uno de 8,5 lo rechaza la API con su JSON 413 diciendo el
    # maximo, y uno de 20 lo corta nginx sin escribir nada en disco.
    client_max_body_size 9m;

    location /api/ {
        # La IP del upstream se resuelve en cada request por el `resolver` de
        # arriba, en vez de una sola vez al arrancar (X-12).
        set $api_upstream http://api:3000;

        # OJO con esto dos veces, porque es la forma de romperlo en silencio:
        #
        #   1. Al pasar el upstream por una variable, nginx deja de hacer el
        #      rebaseo automatico. Con `proxy_pass http://api:3000/` (literal,
        #      con barra final) la location `/api/` se quita del path y Express
        #      recibe `/auth/login`. Ese rebaseo solo ocurre cuando `proxy_pass`
        #      NO lleva variables.
        #
        #   2. Por eso el rebaseo se hace a mano con `rewrite`: se quita el
        #      prefijo `/api` y se pasa el resto. Usar `$request_uri` sin reescribir
        #      hacia que Express recibiera `/api/auth/login` —que no existe— y
        #      todo el API respondia 404 sin error visible en los logs.
        #
        # `break` evita que el `location /` (que hace try_files hacia index.html)
        # tambien corra sobre la misma URI.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # `$proxy_add_x_forwarded_for` APPENDA a la cadena existente. Es
        # correcto con un solo proxy delante: Express toma el último valor con
        # `trust proxy = 1`, y ese lo agrega nginx, no el cliente.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Reintento ante un upstream reiniciándose, en vez de devolver 502 al
        # usuario en la ventana de despliegue.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------
    # OJO con la herencia de `add_header`: un `location` que declara al menos
    # un `add_header` NO hereda los del `server`. Nginx los reemplaza en vez de
    # sumarlos.
    #
    # Por eso los bloques siguientes repiten los headers de seguridad: sin
    # repetirlos, `/assets/` y `/index.html` —justo el documento HTML y el JS—
    # saldrían sin CSP, sin nosniff y sin X-Frame-Options, que es justo el
    # hallazgo X-09. Se define `security_headers.conf` y se incluye en cada uno
    # para que no haya que mantener la lista en tres lugares.
    # ---------------------------------------------------------------

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security_headers.conf;
        try_files $uri =404;
    }

    # Archivos que vienen de `public/`, que Vite copia a la RAIZ de `dist/` y no
    # a `/assets/`. El fondo del login es el caso que duele: con el `no-store`
    # del `server` lo que hereda `location /`, los 1,4 MB del PNG se bajaban
    # enteros en CADA carga del login, para siempre. Ese `no-store` existe por
    # X-10 y esta bien puesto para respuestas autenticadas y para el documento
    # HTML, pero una foto decorativa no tiene nada que proteger: cachearla es lo
    # correcto y no filtra nada.
    #
    # `immutable` NO, a diferencia de `/assets/`: ahi los nombres llevan el hash
    # del contenido, asi que un nombre nuevo es siempre un archivo nuevo. Los de
    # `public/` tienen nombre fijo y se pueden reescribir en el mismo lugar, de
    # modo que `immutable` atraparia al usuario con la version vieja para siempre
    # si el nombre no cambia.
    location ~* \.(?:png|webp|jpe?g|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        include /etc/nginx/security_headers.conf;
        try_files $uri =404;
    }

    location / {
        # Sin `add_header` propios: hereda los del `server`, que es lo correcto
        # para las rutas del SPA que caen en index.html.
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        include /etc/nginx/security_headers.conf;
    }

    # La página de error por defecto de nginx muestra la versión en el cuerpo.
    # Se reemplaza por una vacía: con `server_tokens off` ya no va en la
    # cabecera, pero el body seguía delatándola.
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/plain;
        return 503 "Servicio no disponible\n";
    }
}
