services:
  db:
    image: postgres:18-alpine
    container_name: jebo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jebo_2026}
      POSTGRES_USER: ${DB_USER:-jebo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - jebo_pgdata:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jebo} -d ${DB_NAME:-jebo_2026}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jebo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jebo_2026}
      DB_USER: ${DB_USER:-jebo}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:15173}
      PUBLIC_CORS_ORIGIN: ${PUBLIC_CORS_ORIGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-4}
      DB_POOL_TOTAL: ${DB_POOL_TOTAL:-20}
      TRUST_PROXY: 1
    volumes:
      - jebo_uploads:/app/uploads
    read_only: true
    tmpfs:
      - "/app/logs:uid=1000,gid=1000,mode=0750"
      - "/tmp:uid=1000,gid=1000,mode=1770"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ../JEBO-2026-Frontend
      dockerfile: Dockerfile
    container_name: jebo-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-15173}:80"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  fixture:
    build:
      context: ../JEBO-Fixture
      dockerfile: Dockerfile
    container_name: jebo-fixture
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FIXTURE_PORT:-15174}:80"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  fixture-tunel:
    image: cloudflare/cloudflared:2025.10.0
    container_name: jebo-fixture-tunel
    restart: unless-stopped
    depends_on:
      - fixture
    command: tunnel --no-autoupdate --url http://fixture:80
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  jebo_pgdata:
  jebo_uploads:
