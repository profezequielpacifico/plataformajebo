sonar.projectKey=jebo-2026-backend
sonar.projectName=JEBO-2026 Backend
# tests/ queda fuera a proposito: Jest no cuenta los propios tests como
# ejecutados, asi que si estan en sonar.sources cada linea del suite entra en el
# denominador de cobertura como "no cubierta" y la gate nunca puede pasar.
sonar.sources=src
# Solo constants se excluye de cobertura: es data literal. src/config entra
# completo, y su cobertura real llega por el lcov de Jest.
sonar.coverage.exclusions=src/constants/**
sonar.exclusions=**/node_modules/**,**/coverage/**,uploads/**,logs/**,backups/**,dump_data.json
sonar.javascript.node.maxspace=4096
