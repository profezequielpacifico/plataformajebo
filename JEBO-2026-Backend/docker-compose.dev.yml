services:
  db:
    ports:
      - "127.0.0.1:15432:5432"

  api:
    ports:
      - "127.0.0.1:15252:3000"

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: jebo-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?defina PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?defina PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5051:80"
    volumes:
      - jebo_pgadmin:/var/lib/pgadmin
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETGID
      - SETUID

volumes:
  jebo_pgadmin:
